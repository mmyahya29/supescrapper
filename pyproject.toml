[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supescrapper"
version = "0.4.0"
description = "Universal web DOM scraper — fetch, query, extract, export."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Supescrapper Contributors" }]
keywords = ["scraper", "web-scraping", "dom", "html", "css-selector", "element-detection", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dynamic = ["playwright>=1.40"]
async = ["httpx>=0.25"]
async-dynamic = ["httpx>=0.25", "playwright>=1.40"]
impersonate = ["curl_cffi>=0.5.10"]
stealth = ["playwright-stealth>=1.0.0"]
all = ["httpx>=0.25", "playwright>=1.40", "curl_cffi>=0.5.10", "playwright-stealth>=1.0.0"]
dev = ["pytest>=7.0", "pytest-cov", "pytest-asyncio>=0.21", "ruff"]

[project.scripts]
supescrapper = "supescrapper.cli:main"

[project.urls]
Repository = "https://github.com/example/supescrapper"

[tool.hatch.build.targets.wheel]
packages = ["src/supescrapper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "asyncio: mark the test as an asynchronous coroutine.",
]
